<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operation Jackpot</title>
<style>
  @font-face { font-family: "Manrope"; font-weight: 200 800; src: url("../../neuzeit-prototyp/fonts/manrope.woff2") format("woff2"); }
  @font-face { font-family: "Fraunces"; font-style: italic; font-weight: 300 500; src: url("../../neuzeit-prototyp/fonts/fraunces-italic.woff2") format("woff2"); }
  html, body { margin: 0; height: 100%; background: #05070e; }
  body { display: grid; place-items: center; }
  canvas { display: block; width: min(100vw, 177.78vh); height: auto; }
  #play { position: fixed; inset: 0; margin: auto; width: 220px; height: 64px; border: 0; border-radius: 32px;
          font: 700 22px Manrope, system-ui, sans-serif; color: #FBF8F5; background: #E95739; cursor: pointer; }
  body.render #play { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<button id="play" type="button">▶ Abspielen</button>
<audio id="ton" src="build/ton.wav" preload="auto"></audio>
<script src="build/timeline.js"></script>
<script>
"use strict";
// Operation Jackpot: jede Szene ist eine Funktion der Zeit. Zeiten kommen aus build/timeline.js (bauen.py).

const C = document.getElementById("c");
const X = C.getContext("2d");
const W = 1280, H = 720;
const TL = window.TIMELINE;
const SZ = Object.fromEntries(TL.szenen.map(s => [s.id, s]));
const S = (id, i) => SZ[id].saetze[i];
const CUE = (id, name) => TL.cues.find(c => c.szene === id && c.name === name);

const F = {
  nacht: "#18203F", tief: "#0b1024", koralle: "#E95739", korallHell: "#FF8A70",
  creme: "#FBF8F5", dunst: "#B9C2D4", gold: "#F2C14E", schwarz: "#05070e",
};
const NAMENSFARBE = { yannick: F.korallHell, aurel: "#9CC3FF", navi: "#8FE3B0", croupier: F.gold, tuersteher: "#C9A0FF" };

// ------------------------------------------------------------------ Werkzeuge

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;
const ss = (a, b, t) => { const u = clamp((t - a) / (b - a)); return u * u * (3 - 2 * u); };
const easeOut = u => 1 - Math.pow(1 - clamp(u), 3);
const easeBack = u => { u = clamp(u); const c = 1.9; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const TAU = Math.PI * 2;

function ell(x, y, rx, ry, farbe, rot = 0) { X.beginPath(); X.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, TAU); X.fillStyle = farbe; X.fill(); }
function rr(x, y, w, h, r, farbe) { X.beginPath(); X.roundRect(x, y, w, h, r); X.fillStyle = farbe; X.fill(); }
function linie(x1, y1, x2, y2, b, farbe) { X.beginPath(); X.moveTo(x1, y1); X.lineTo(x2, y2); X.lineWidth = b; X.strokeStyle = farbe; X.lineCap = "round"; X.stroke(); }
function text(t, x, y, groesse, farbe, opt = {}) {
  X.font = `${opt.stil || ""} ${opt.gewicht || 700} ${groesse}px ${opt.familie || "Manrope"}`;
  X.fillStyle = farbe; X.textAlign = opt.align || "center"; X.textBaseline = opt.base || "middle";
  X.letterSpacing = opt.abstand || "0px";
  X.fillText(t, x, y);
  X.letterSpacing = "0px";
}
function glow(x, y, r, farbe, a) {
  const g = X.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, farbe.replace("A", a)); g.addColorStop(1, farbe.replace("A", 0));
  X.fillStyle = g; X.fillRect(x - r, y - r, 2 * r, 2 * r);
}

// Mundöffnung einer Figur zur Zeit t, aus der Lautstärke ihrer Stimme
function mund(wer, t) {
  for (const s of TL.szenen) {
    if (t < s.start || t >= s.ende) continue;
    for (const x of s.saetze) {
      if (x.wer === wer && t >= x.start && t < x.ende) return x.env[Math.min(x.env.length - 1, Math.floor((t - x.start) * TL.fps))] || 0;
    }
  }
  return 0;
}
function spricht(wer, t, vor = 0, nach = 0) {
  for (const s of TL.szenen) for (const x of s.saetze) if (x.wer === wer && t >= x.start - vor && t < x.ende + nach) return true;
  return false;
}

// Posen: Handpositionen relativ zu den Füßen (Figur ist etwa 360 Einheiten groß)
const POSE = {
  locker:   { L: [-66, -122, "offen"], R: [66, -122, "offen"] },
  offen:    { L: [-122, -236, "offen"], R: [122, -236, "offen"] },
  zeigenR:  { L: [-66, -122, "offen"], R: [156, -262, "zeigen"] },
  markerR:  { L: [-66, -122, "offen"], R: [146, -246, "marker"] },
  daumenR:  { L: [-66, -122, "offen"], R: [96, -222, "daumen"] },
  achsel:   { L: [-96, -205, "offen"], R: [96, -205, "offen"] },
  jubel:    { L: [-98, -392, "offen"], R: [98, -392, "offen"] },
  schale:   { L: [-40, -150, "offen"], R: [40, -150, "offen"] },
  essen:    { L: [-10, -264, "faust"], R: [40, -150, "offen"] },
  tippen:   { L: [-42, -160, "offen"], R: [42, -160, "offen"] },
  abwehr:   { L: [-92, -268, "offen"], R: [92, -268, "offen"] },
  schieben: { L: [-66, -122, "offen"], R: [86, -150, "offen"] },
  finger:   { L: [-66, -122, "offen"], R: [76, -306, "zeigen"] },
  kratzen:  { L: [-66, -122, "offen"], R: [44, -352, "faust"] },
  winkenR:  { L: [-66, -122, "offen"], R: [124, -196, "offen"] },
  werfen:   { L: [-66, -122, "offen"], R: [-40, -176, "faust"] },
  verschr:  { L: [36, -186, "faust"], R: [-36, -186, "faust"] },
  sofaA:    { L: [-52, -150, "offen"], R: [42, -204, "schlauch"] },
  prostA:   { L: [-52, -150, "offen"], R: [92, -312, "schlauch"] },
  ziehenA:  { L: [-52, -150, "offen"], R: [14, -268, "schlauch"] },
  daumenA:  { L: [-96, -222, "daumen"], R: [42, -204, "schlauch"] },
  sofaY:    { L: [-42, -196, "glas"], R: [42, -204, "schlauch"] },
  prostY:   { L: [-92, -312, "glas"], R: [42, -204, "schlauch"] },
  ziehenY:  { L: [-42, -196, "glas"], R: [14, -268, "schlauch"] },
};

// Wechselt weich zwischen Posen; keys = [[Zeit, Pose], ...]
function pose(t, keys) {
  keys = keys.slice().sort((a, b) => a[0] - b[0]);
  let i = 0;
  while (i + 1 < keys.length && keys[i + 1][0] <= t) i++;
  const neu = POSE[keys[i][1]] || keys[i][1];
  if (i === 0) return neu;
  const alt = POSE[keys[i - 1][1]] || keys[i - 1][1];
  const u = ss(keys[i][0], keys[i][0] + 0.28, t);
  const mix = s => [lerp(alt[s][0], neu[s][0], u), lerp(alt[s][1], neu[s][1], u), u < 0.5 ? alt[s][2] : neu[s][2]];
  return { L: mix("L"), R: mix("R") };
}

// ------------------------------------------------------------------ Figuren

const STIL = {
  yannick: { haut: "#F1C4A3", haare: "locken", haar: "#9A522D", haarDunkel: "#76391D", bart: "voll", bartFarbe: "#8C4727",
             kleid: "hoodie", oben: "#30323B", shirt: "#1B1C22", hose: "#262A37", schuhe: "#15161A", breite: 66, kopfhoerer: true },
  aurel:   { haut: "#F4CBAA", haare: "scheitel", haar: "#5E3C24", haarDunkel: "#462B18", bart: "schnurr", bartFarbe: "#4A2E1A",
             kleid: "mantel", oben: "#1F2A4E", shirt: "#283462", hose: "#20263A", schuhe: "#19130F", breite: 56 },
  tuersteher: { haut: "#D29A74", haare: "glatze", kleid: "anzug", oben: "#131419", shirt: "#E9E9EE", hose: "#131419",
                schuhe: "#0A0A0A", breite: 86, sonnenbrille: true, hoerner: true },
  croupier: { haut: "#EFC29F", haare: "gegelt", haar: "#2A2320", haarDunkel: "#171211", bart: "schnurr", bartFarbe: "#2A2320",
              kleid: "weste", oben: "#6B1B2C", shirt: "#F4F1EC", hose: "#15151A", schuhe: "#0A0A0A", breite: 58, fliege: true },
};

function figur(p) {
  const st = STIL[p.stil];
  const f = c => (p.silhouette ? F.schwarz : c);
  const t = p.t;
  const B = st.breite;
  const oben = p.sitzen ? 55 : 0;
  const gang = p.gehen ?? null;
  const hops = gang !== null ? Math.abs(Math.sin(gang)) * 5 : 0;
  const hand = pose(t, p.keys || [[0, "locker"]]);
  const m = clamp(p.m || 0);

  X.save();
  X.translate(p.x, p.y);
  X.scale(p.s * (p.spiegeln ? -1 : 1), p.s);
  if (p.alpha !== undefined) X.globalAlpha = p.alpha;

  // Beine
  if (!p.ohneBeine) {
    if (p.sitzen) {
      for (const sx of [-1, 1]) {
        rr(sx * 21 - 12, -64, 24, 86, 10, f(st.hose));
        ell(sx * 21, -64, 23, 17, f(st.hose));
        ell(sx * 23, 22, 21, 9, f(st.schuhe));
      }
    } else {
      for (const sx of [-1, 1]) {
        const sw = gang !== null ? Math.sin(gang) * 20 * sx : 0;
        linie(sx * 17, -104, sx * 18 + sw, -14, 27, f(st.hose));
        ell(sx * 20 + sw, -8, 21, 9, f(st.schuhe));
      }
    }
  }
  if (p.nurBeine) { X.restore(); return; }

  X.translate(0, oben - hops);
  if (p.wackeln) X.translate(Math.sin(t * 40) * p.wackeln, 0);

  // Rumpf
  const saum = p.sitzen ? -96 : -50;
  if (st.kleid === "mantel") {
    rr(-B, -240, 2 * B, 240 + saum, 24, f(st.oben));
    X.beginPath(); X.moveTo(-21, -240); X.lineTo(21, -240); X.lineTo(6, -168); X.lineTo(-6, -168); X.closePath();
    X.fillStyle = f(st.shirt); X.fill();
    rr(-21, -252, 42, 18, 7, f(st.shirt));
    linie(0, -250, 0, -205, 2.5, f("#8A93AD"));
    for (const sx of [-1, 1]) {
      X.beginPath(); X.moveTo(sx * 21, -240); X.lineTo(sx * 7, -168); X.lineTo(sx * 38, -212); X.closePath();
      X.fillStyle = f("#2E3C6C"); X.fill();
    }
    linie(0, -168, 0, saum + 4, 2, f("#141C38"));
    for (const by of [-150, -118, -86]) if (by < saum - 6) ell(12, by, 4.5, 4.5, f("#10162C"));
  } else if (st.kleid === "hoodie") {
    rr(-B, -240, 2 * B, 140, 30, f(st.oben));
    ell(0, -242, 42, 13, f("#24262E"));
    rr(-24, -238, 48, 136, 8, f(st.shirt));
    text("€", 0, -175, 34, p.silhouette ? F.schwarz : "rgba(233,87,57,0.55)", { gewicht: 800 });
    linie(-17, -234, -15, -192, 2.5, f("#C9CCD6"));
    linie(17, -234, 15, -192, 2.5, f("#C9CCD6"));
  } else if (st.kleid === "anzug") {
    rr(-B, -244, 2 * B, 150, 34, f(st.oben));
    X.beginPath(); X.moveTo(-20, -244); X.lineTo(20, -244); X.lineTo(0, -190); X.closePath(); X.fillStyle = f(st.shirt); X.fill();
    X.beginPath(); X.moveTo(-5, -238); X.lineTo(5, -238); X.lineTo(7, -196); X.lineTo(0, -188); X.lineTo(-7, -196); X.closePath();
    X.fillStyle = f("#000"); X.fill();
  } else if (st.kleid === "weste") {
    rr(-B, -240, 2 * B, 138, 24, f(st.shirt));
    for (const sx of [-1, 1]) {
      X.beginPath(); X.moveTo(sx * 12, -238); X.lineTo(sx * (B - 4), -232); X.lineTo(sx * (B - 6), -104); X.lineTo(sx * 2, -104); X.lineTo(sx * 2, -190); X.closePath();
      X.fillStyle = f(st.oben); X.fill();
    }
  }

  // Hals und Kopf
  rr(-14, -262, 28, 28, 8, f(st.haut));
  if (st.kopfhoerer) {
    for (const sx of [-1, 1]) { ell(sx * 31, -240, 14, 17, f("#121317")); ell(sx * 31, -240, 8, 10, f(F.koralle)); }
  }
  X.save();
  X.translate(0, -300);
  X.rotate(p.neigen || 0);
  X.translate(0, 300);
  kopf(p, st, f, m);
  X.restore();

  // Arme
  for (const seite of ["L", "R"]) {
    const sx = seite === "L" ? -1 : 1;
    const [hx, hy, art] = hand[seite];
    const zx = sx * (B - 10), zy = -224;
    const mx = (zx + hx) / 2 + sx * 18, my = (zy + hy) / 2 + 10;
    X.beginPath(); X.moveTo(zx, zy); X.quadraticCurveTo(mx, my, hx, hy);
    X.lineWidth = st.breite > 80 ? 30 : 23; X.strokeStyle = f(st.kleid === "weste" ? st.shirt : st.oben); X.lineCap = "round"; X.stroke();
    handZeichnen(hx, hy, art, sx, st, f, t);
  }
  if (p.extra) p.extra(f);
  X.restore();
}

function handZeichnen(x, y, art, sx, st, f, t) {
  if (art === "glas") {
    rr(x - 9, y - 34, 18, 26, 4, f("rgba(255,255,255,0.55)"));
    rr(x - 7, y - 24, 14, 15, 3, f("#C8702A"));
  }
  if (art === "schlauch") {
    rr(x - 5, y - 34, 10, 30, 4, f("#C9CED9"));
    rr(x - 7, y - 40, 14, 9, 3, f(F.gold));
  }
  ell(x, y, 12, 12, f(st.haut));
  if (art === "daumen") rr(x - 5, y - 28, 10, 20, 5, f(st.haut));
  if (art === "zeigen") {
    const a = Math.atan2(y + 224, x - sx * 50);
    linie(x, y, x + Math.cos(a) * 18, y + Math.sin(a) * 18, 8, f(st.haut));
  }
  if (art === "marker") { X.save(); X.translate(x, y); X.rotate(-0.6); rr(-4, -26, 9, 24, 3, f("#1B2A6B")); X.restore(); }
}

function kopf(p, st, f, m) {
  const t = p.t;
  const bx = (p.blick || 0) * 6;
  // Haare hinten
  if (st.haare === "locken") ell(0, -322, 58, 42, f(st.haarDunkel));
  if (st.haare === "scheitel") { rr(-55, -340, 110, 70, 30, f(st.haarDunkel)); }
  // Ohren und Gesicht
  ell(-49, -298, 9, 13, f(st.haut)); ell(49, -298, 9, 13, f(st.haut));
  ell(0, -300, 48, 55, f(st.haut));
  // Bart
  if (st.bart === "voll") {
    X.save(); X.beginPath(); X.rect(-60, -296, 120, 80); X.clip();
    ell(0, -286, 50, 50, f(st.bartFarbe));
    X.restore();
    ell(-22 + bx * 0.5, -292, 17, 10, f(st.haut)); ell(22 + bx * 0.5, -292, 17, 10, f(st.haut));
    ell(bx * 0.5, -279, 18, 6, f(st.bartFarbe));
  }
  if (!p.silhouette) { ell(-30 + bx * 0.4, -284, 9, 6, "rgba(232,120,110,0.25)"); ell(30 + bx * 0.4, -284, 9, 6, "rgba(232,120,110,0.25)"); }
  // Augen
  const zu = p.augenZu || ((t + (p.stil.length * 0.9)) % 3.7) < 0.12;
  const brau = (p.brauen || 0) * 7;
  for (const sx of [-1, 1]) {
    const ax = sx * 18 + bx, ay = -306;
    if (st.sonnenbrille) continue;
    if (zu) linie(ax - 6, ay, ax + 6, ay, 3, f("#2A1C14"));
    else { ell(ax, ay, 5.5, 7.5, f("#231812")); if (!p.silhouette) ell(ax + 1.8, ay - 2.5, 1.8, 2, "#fff"); }
    const bf = st.haare === "glatze" ? "#6b4a36" : (st.bartFarbe || st.haar);
    linie(ax - 8, ay - 15 - brau + sx * -1, ax + 8, ay - 16 - brau - sx * 1.5, 3.5, f(bf));
  }
  if (st.sonnenbrille) {
    rr(-34 + bx, -316, 30, 18, 6, f("#07080c")); rr(4 + bx, -316, 30, 18, 6, f("#07080c"));
    linie(-4 + bx, -309, 4 + bx, -309, 3, f("#07080c"));
  }
  // Nase
  ell(bx * 1.2, -291, 6, 5, f("rgba(200,120,90,0.45)"));
  // Mund
  const my = -272 + (st.bart === "voll" ? 2 : 0);
  if (m > 0.06) {
    ell(bx, my, 9 + 4 * m, 3 + 12 * m, f("#6E2323"));
    if (!p.silhouette) ell(bx, my + 2 + 7 * m, 5 + 2 * m, 2 + 3 * m, "#C9585B");
  } else {
    X.beginPath(); X.arc(bx, my - 6, 11, 0.2 * Math.PI, 0.8 * Math.PI);
    X.lineWidth = 3.2; X.strokeStyle = f("#6E2323"); X.lineCap = "round"; X.stroke();
  }
  if (st.bart === "schnurr") {
    X.beginPath(); X.moveTo(-15 + bx, my - 8); X.quadraticCurveTo(bx, my - 15, 15 + bx, my - 8);
    X.lineWidth = 4.5; X.strokeStyle = f(st.bartFarbe); X.stroke();
  }
  // Haare vorne
  if (st.haare === "locken") {
    for (let i = 0; i < 22; i++) {
      const a = Math.PI * (1.02 + 0.96 * i / 21);
      const r = 50 + 6 * hash(i + 3);
      ell(Math.cos(a) * r, -306 + Math.sin(a) * r * 0.92, 15 + 5 * hash(i), 15 + 5 * hash(i + 9), f(i % 3 ? st.haar : st.haarDunkel));
    }
    for (let i = 0; i < 7; i++) {
      const a = Math.PI * (1.2 + 0.6 * i / 6);
      ell(Math.cos(a) * 30, -318 + Math.sin(a) * 28, 16, 15, f(i % 2 ? st.haar : "#A85E35"));
    }
    for (const sx of [-1, 1]) { ell(sx * 50, -310, 12, 18, f(st.haar)); ell(sx * 47, -290, 7, 14, f(st.bartFarbe)); }
  }
  if (st.haare === "scheitel") {
    X.beginPath();
    X.moveTo(-6, -358);
    X.bezierCurveTo(-36, -356, -58, -332, -54, -284);
    X.lineTo(-44, -286);
    X.bezierCurveTo(-42, -312, -30, -330, -4, -334);
    X.bezierCurveTo(16, -330, 34, -322, 44, -296);
    X.lineTo(54, -290);
    X.bezierCurveTo(58, -330, 36, -356, -6, -358);
    X.fillStyle = f(st.haar); X.fill();
    X.beginPath(); X.moveTo(-4, -356); X.quadraticCurveTo(-26, -340, -40, -300);
    X.moveTo(4, -354); X.quadraticCurveTo(28, -342, 44, -306);
    X.lineWidth = 2; X.strokeStyle = f(st.haarDunkel); X.stroke();
  }
  if (st.haare === "glatze" && !p.silhouette) ell(-14, -340, 14, 7, "rgba(255,255,255,0.25)", -0.3);
  if (st.haare === "gegelt") {
    X.save(); X.beginPath(); X.rect(-60, -380, 120, 66); X.clip();
    ell(0, -310, 50, 50, f(st.haar)); X.restore();
    if (!p.silhouette) linie(-24, -348, 18, -352, 3, "rgba(255,255,255,0.35)");
  }
  if (st.hoerner) {
    for (const sx of [-1, 1]) {
      X.beginPath(); X.moveTo(sx * 18, -350); X.quadraticCurveTo(sx * 30, -384, sx * 38, -392); X.quadraticCurveTo(sx * 36, -366, sx * 34, -342);
      X.closePath(); X.fillStyle = f("#D3263A"); X.fill();
    }
  }
  if (st.fliege) {
    X.beginPath(); X.moveTo(0, -244); X.lineTo(-16, -252); X.lineTo(-16, -236); X.closePath();
    X.moveTo(0, -244); X.lineTo(16, -252); X.lineTo(16, -236); X.closePath(); X.fillStyle = f("#0A0A0A"); X.fill();
  }
}

// ------------------------------------------------------------------ Kulissen

function himmel(oben, unten) {
  const g = X.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, oben); g.addColorStop(1, unten);
  X.fillStyle = g; X.fillRect(0, 0, W, H);
}

function sterne(t, n, yMax, versatz = 0) {
  for (let i = 0; i < n; i++) {
    const x = ((hash(i) * W * 1.3 - versatz * (0.2 + hash(i + 7) * 0.2)) % W + W) % W;
    const y = hash(i + 50) * yMax;
    const a = 0.35 + 0.65 * Math.abs(Math.sin(t * (0.6 + hash(i + 3) * 2) + i));
    ell(x, y, 1 + hash(i + 9) * 1.4, 1 + hash(i + 9) * 1.4, `rgba(251,248,245,${a})`);
  }
}

function mond(x, y, r) {
  glow(x, y, r * 2.6, "rgba(246,239,217,A)", 0.22);
  ell(x, y, r, r, "#F6EFD9");
  ell(x - r * 0.3, y - r * 0.2, r * 0.18, r * 0.18, "rgba(200,190,160,0.45)");
  ell(x + r * 0.35, y + r * 0.25, r * 0.12, r * 0.12, "rgba(200,190,160,0.45)");
  ell(x + r * 0.1, y - r * 0.45, r * 0.08, r * 0.08, "rgba(200,190,160,0.45)");
}

function kuerbis(x, y, r, t, zwinkern = false) {
