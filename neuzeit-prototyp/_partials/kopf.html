<link rel="preload" href="fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<script>
  /* Gespeicherte Farbvariante vor dem ersten Zeichnen setzen, damit nichts flackert. */
  try {
    var savedPalette = localStorage.getItem("neuzeit-palette");
    if (savedPalette === "warm" || savedPalette === "klar" || savedPalette === "frisch") {
      document.documentElement.setAttribute("data-palette", savedPalette);
    }
  } catch (e) {}
  document.documentElement.classList.add("js");
  /* Seitenwechsel mit Übergang: Die Kopfzeile bleibt stehen, ihr Intro entfällt.
     Kam der Besuch von einer Unterseite, gleitet die kleine Sonne zur neuen
     Position, statt neu aufzugehen. Die Klassen bleiben stehen, sonst würden
     die Animationen nach dem Übergang doch noch starten. */
  window.addEventListener("pagereveal", function (event) {
    if (!event.viewTransition) return;
    var root = document.documentElement;
    root.classList.add("vt-nav");
    try {
      var from = window.navigation && navigation.activation && navigation.activation.from;
      if (from && /\/(leistungen|ueber-uns|kontakt|impressum|datenschutz)\.html/.test(from.url)) {
        root.classList.add("vt-from-sub");
      }
    } catch (e) {}
  });
</script>
<script src="main.js" defer></script>
